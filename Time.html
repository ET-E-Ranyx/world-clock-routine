<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>世界時鐘</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        .clock-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px 40px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.2);
            min-width: 280px;
        }
        
        .clock-card.usa {
            box-shadow: 0 8px 32px rgba(66, 133, 244, 0.3);
        }
        
        .clock-card.taiwan {
            box-shadow: 0 8px 32px rgba(234, 67, 53, 0.3);
        }
        
        .flag {
            font-size: 48px;
            margin-bottom: 10px;
        }
        
        .location {
            color: #ffffff;
            font-size: 1.2em;
            margin-bottom: 5px;
            font-weight: 600;
        }
        
        .timezone {
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.9em;
            margin-bottom: 20px;
        }
        
        .time {
            color: #ffffff;
            font-size: 3em;
            font-weight: 700;
            letter-spacing: 2px;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
        }
        
        .date {
            color: rgba(255, 255, 255, 0.8);
            font-size: 1.1em;
            margin-top: 15px;
        }
        
        .seconds {
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.5em;
            vertical-align: super;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="clock-card usa">
            <div class="flag">🇺🇸</div>
            <div class="location">美國西岸</div>
            <div class="timezone">太平洋時間 (PT)</div>
            <div class="time" id="usa-time">--:--:--</div>
            <div class="date" id="usa-date">----年--月--日</div>
        </div>
        
        <div class="clock-card taiwan">
            <div class="flag">🇹🇼</div>
            <div class="location">台灣</div>
            <div class="timezone">台北時間 (CST)</div>
            <div class="time" id="taiwan-time">--:--:--</div>
            <div class="date" id="taiwan-date">----年--月--日</div>
        </div>
    </div>

    <script>
        function updateClocks() {
            const now = new Date();
            
            // 美國西岸時間 (太平洋時間)
            const usaOptions = {
                timeZone: 'America/Los_Angeles',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: false
            };
            const usaDateOptions = {
                timeZone: 'America/Los_Angeles',
                year: 'numeric',
                month: 'long',
                day: 'numeric',
                weekday: 'long'
            };
            
            // 台灣時間
            const taiwanOptions = {
                timeZone: 'Asia/Taipei',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: false
            };
            const taiwanDateOptions = {
                timeZone: 'Asia/Taipei',
                year: 'numeric',
                month: 'long',
                day: 'numeric',
                weekday: 'long'
            };
            
            // 更新美國西岸時間
            document.getElementById('usa-time').textContent = 
                now.toLocaleTimeString('zh-TW', usaOptions);
            document.getElementById('usa-date').textContent = 
                now.toLocaleDateString('zh-TW', usaDateOptions);
            
            // 更新台灣時間
            document.getElementById('taiwan-time').textContent = 
                now.toLocaleTimeString('zh-TW', taiwanOptions);
            document.getElementById('taiwan-date').textContent = 
                now.toLocaleDateString('zh-TW', taiwanDateOptions);
        }
        
        // 立即更新一次
        updateClocks();
        
        // 每秒更新
        setInterval(updateClocks, 1000);
    </script>
</body>
</html>
